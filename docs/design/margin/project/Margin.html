<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Margin — Markdown 编辑器</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/default-dark.min.css" />
<link rel="stylesheet" href="margin.css" />
</head>
<body>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#1c1a17"/>
    <text x="50" y="64" font-family="Georgia, serif" font-style="italic" font-size="46" fill="#e0c060" text-anchor="middle">M</text>
  </svg>
</template>

<div id="app">
  <!-- title bar -->
  <div class="titlebar">
    <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="title-doc" id="title-doc">
      <span class="crumb">随笔</span><span>/</span><span id="title-name">Margin · 使用指南</span>
      <span class="dot">●</span>
    </div>
    <div class="tb-tools">
      <button class="tb-btn" id="btn-sidebar" title="切换笔记列表 (⌘B)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
      <button class="tb-btn" id="btn-theme" title="切换主题"></button>
      <button class="tb-btn" id="btn-settings" title="设置 (⌘,)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 0 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 0 1 0-4h.1A1.6 1.6 0 0 0 2.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 0 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H23a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="tb-btn" id="btn-drawer" title="块库 (⌘\\)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
    </div>
  </div>

  <!-- body -->
  <div class="body" id="body">
    <!-- sidebar -->
    <aside class="sidebar">
      <div class="sb-head">
        <div class="sb-brand"><div class="sb-mark">M</div><b>Margin</b></div>
        <button class="sb-new" title="新建笔记">+</button>
      </div>
      <div class="sb-search"><span class="ic">⌕</span><input id="sb-search-input" placeholder="搜索文件…" /></div>
      <div class="sb-section">文件库</div>
      <div class="sb-list" id="sb-list"></div>
    </aside>

    <!-- editor -->
    <main class="editor-col">
      <div class="editor-scroll" id="editor-scroll">
        <div class="editor-wrap">
          <h1 class="doc-title" id="doc-title" contenteditable="true" spellcheck="false">Margin · 使用指南</h1>
          <div class="doc-meta">
            <span id="doc-date">2026 年 5 月 30 日</span>
            <span class="tag" id="doc-tag">上手</span>
          </div>
          <div class="editor" id="editor"></div>
        </div>
      </div>
      <div class="statusbar">
        <span class="sb-i" id="st-chars"></span>
        <span class="sb-i" id="st-words"></span>
        <span class="sb-i" id="st-read"></span>
        <span class="spacer"></span>
        <span class="sb-i" id="st-blocks"></span>
        <span class="sb-i save-state" id="st-save">已同步</span>
      </div>
    </main>

    <!-- drawer: block library -->
    <aside class="drawer">
      <div class="dr-head">
        <b>块库</b>
        <span class="hint">拖入正文 · 或点击插入</span>
      </div>
      <div class="dr-search"><span class="ic">⌕</span><input id="dr-search-input" placeholder="搜索块…  也可输入 “/” 唤起" /></div>
      <div class="dr-body" id="dr-body"></div>
    </aside>
  </div>
</div>

<!-- slash command menu -->
<div class="slash" id="slash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="data.js"></script>
<script src="editor.js"></script>
<script src="settings.js"></script>
<script src="app.js"></script>

<style id="__om-edit-overrides"></style>
</body>
</html>
